<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="spk3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081524"/>
      <stop offset="100%" stop-color="#142c44"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" rx="20" fill="url(#spk3Bg)"/>

  <!-- DevOps / Architecture Graphic Overlay -->
  <g opacity="0.4" stroke="#38bdf8" stroke-width="1.2" filter="url(#glow3)">
    <circle cx="70" cy="70" r="15" fill="none"/>
    <circle cx="330" cy="70" r="15" fill="none"/>
    <rect x="55" y="270" width="45" height="35" rx="5" fill="none"/>
    <rect x="300" y="270" width="45" height="35" rx="5" fill="none"/>
    <line x1="85" y1="70" x2="315" y2="70"/>
    <line x1="70" y1="85" x2="77.5" y2="270"/>
    <line x1="330" y1="85" x2="322.5" y2="270"/>
  </g>

  <!-- Speaker Avatar Silhouette (Male Software Architect / Lead) -->
  <g transform="translate(100, 70)">
    <circle cx="100" cy="90" r="75" fill="rgba(56, 189, 248, 0.15)" filter="url(#glow3)"/>
    <circle cx="100" cy="80" r="44" fill="#f8fafc"/>
    <!-- Eyes & Smile -->
    <circle cx="85" cy="76" r="4" fill="#0f172a"/>
    <circle cx="115" cy="76" r="4" fill="#0f172a"/>
    <path d="M88,102 Q100,114 112,102" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <!-- Short Hair -->
    <path d="M56,70 Q100,35 144,70 Q135,48 100,48 Q65,48 56,70 Z" fill="#0f172a"/>
    <!-- Black Polo Shirt Shoulders -->
    <path d="M22,240 C22,160 52,150 100,150 C148,150 178,160 178,240 Z" fill="#020617"/>
    <!-- Polo V-Collar -->
    <polygon points="90,150 100,175 110,150" fill="#1e293b"/>
  </g>
</svg>
