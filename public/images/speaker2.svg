<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="spk2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091428"/>
      <stop offset="100%" stop-color="#1b1240"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" rx="20" fill="url(#spk2Bg)"/>

  <!-- AI App Graphic Overlay -->
  <g opacity="0.4" stroke="#a78bfa" stroke-width="1.2" filter="url(#glow2)">
    <rect x="50" y="60" width="60" height="45" rx="6" fill="none"/>
    <rect x="290" y="80" width="60" height="45" rx="6" fill="none"/>
    <circle cx="310" cy="270" r="16" fill="none"/>
    <line x1="110" y1="82.5" x2="290" y2="102.5"/>
    <line x1="320" y1="125" x2="310" y2="254"/>
  </g>

  <!-- Speaker Avatar Silhouette (Female AI Engineer) -->
  <g transform="translate(100, 70)">
    <circle cx="100" cy="90" r="75" fill="rgba(167, 139, 250, 0.15)" filter="url(#glow2)"/>
    <!-- Head -->
    <circle cx="100" cy="80" r="42" fill="#fde047" opacity="0.9"/>
    <circle cx="100" cy="80" r="42" fill="#f8fafc"/>
    <!-- Eyes & Smile -->
    <circle cx="86" cy="76" r="4" fill="#0f172a"/>
    <circle cx="114" cy="76" r="4" fill="#0f172a"/>
    <path d="M88,98 Q100,112 112,98" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <!-- Hair -->
    <path d="M50,75 C45,140 60,160 70,160 C75,120 75,65 100,65 C125,65 125,120 130,160 C140,160 155,140 150,75 C145,35 55,35 50,75 Z" fill="#1e1b4b"/>
    <!-- Top Shoulders -->
    <path d="M25,240 C25,160 55,150 100,150 C145,150 175,160 175,240 Z" fill="#0f172a"/>
  </g>
</svg>
