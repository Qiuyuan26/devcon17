<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 400" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <linearGradient id="horizonGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="80%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="cloudGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#09143c" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="cloudGradRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#09143c" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </linearGradient>

    <filter id="cityGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Horizon Soft Sunset Glow Layer -->
  <rect x="0" y="0" width="1440" height="400" fill="url(#horizonGlow)"/>

  <!-- Left Cumulus Cloud Puff Silhouette -->
  <path d="M-100,400 Q-50,200 120,220 Q220,120 380,180 Q500,100 620,240 Q700,280 750,400 Z" fill="url(#cloudGradLeft)"/>

  <!-- Right Cumulus Cloud Puff Silhouette -->
  <path d="M1540,400 Q1490,180 1320,200 Q1220,100 1060,160 Q940,80 820,220 Q740,280 690,400 Z" fill="url(#cloudGradRight)"/>

  <!-- Glowing City Skyline Silhouette -->
  <g fill="#020617" filter="url(#cityGlow)">
    <path d="M0,400 L0,340 L80,340 L80,360 L140,360 L140,310 L200,310 L200,380 L320,380 L320,290 L350,260 L380,290 L380,380 L480,380 L480,330 L550,330 L550,370 L640,370 L640,300 L700,300 L700,380 L790,380 L790,320 L860,320 L860,380 L960,380 L960,280 L990,240 L1020,280 L1020,380 L1120,380 L1120,330 L1180,330 L1180,360 L1260,360 L1260,310 L1340,310 L1340,370 L1440,370 L1440,400 Z"/>
  </g>

  <!-- City Skyline Lights & Beacons -->
  <g fill="#fef08a" opacity="0.8">
    <circle cx="350" cy="260" r="2.5"/>
    <circle cx="990" cy="240" r="2.5"/>
    <circle cx="140" cy="315" r="1.5" fill="#38bdf8"/>
    <circle cx="700" cy="305" r="1.5" fill="#38bdf8"/>
    <circle cx="1260" cy="315" r="1.5" fill="#f472b6"/>
  </g>

  <!-- Glowing Curved Highway Light Trails at Bottom -->
  <path d="M-100,390 Q720,340 1540,390" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2" fill="none" filter="url(#cityGlow)"/>
  <path d="M-100,395 Q720,348 1540,395" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5" fill="none" filter="url(#cityGlow)"/>
</svg>
